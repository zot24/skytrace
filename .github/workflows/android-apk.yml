name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: apps/android/**/*.gradle*

      - name: Install Android 35
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Assemble release APK
        working-directory: apps/android
        run: ./gradlew assembleRelease --stacktrace --no-daemon -PversionCode=${{ github.run_number }}

      - name: Publish the APK on a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' apps/android/app/build.gradle.kts)
          short="${GITHUB_SHA::7}"
          tag="android-v${version}-${short}"
          apk="skytrace-v${version}-${short}.apk"
          cp apps/android/app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "Android v${version} (${short})" \
            --notes "Install the .apk from this release. It is signed with the shared Skytrace debug key. If an older Skytrace is already installed and Android reports a signature problem, uninstall that copy once, then install this one. Later releases update over this one." \
            "$apk"
