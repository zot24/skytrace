name = "skytrace-trails"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# adsb.lol publishes no numeric limit, so one request per 15s across all tiles.
POLL_SECONDS = "15"
# lat,lon,radiusNm per tile (Canary Islands), polled round-robin. 250nm is the API maximum.
TILES = "28.4,-15.8,150"

[[durable_objects.bindings]]
name = "POLLER"
class_name = "Poller"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Poller"]

[[r2_buckets]]
binding = "TRAILS"
bucket_name = "skytrace-trails"

[dev]
port = 8788
ip = "127.0.0.1"
